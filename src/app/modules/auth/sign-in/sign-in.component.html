<!-- Container -->
<div class="flex flex-wrap min-h-screen w-full content-center justify-center bg-gray-200 py-10">

    <!-- Login component -->
    <div class="flex shadow-md">
      <!-- Login form -->
      <div class="flex flex-wrap content-center justify-center rounded-l-md bg-white" style="width: 24rem; height: 32rem;">
        <div class="w-72">
          <!-- Heading -->
          <h1 class="text-2xl font-bold mb-2">Iniciar sesión</h1>
          <small class="text-gray-400 mb-6 block">¡Bienvenido! Por favor, introduzca sus datos</small>
  
          <!-- Form -->
          <form (ngSubmit)="login()">
            <div class="mb-4">
              <label class="mb-2 block text-sm font-semibold">Email</label>
              <input 
                type="email" 
                [(ngModel)]="email" 
                name="email" 
                placeholder="Enter your email" 
                class="block w-full rounded-md border border-gray-300 focus:border-purple-700 focus:outline-none focus:ring-1 focus:ring-purple-700 py-2 px-2 text-gray-500" 
              />
            </div>
  
            <div class="mb-4">
              <label class="mb-2 block text-sm font-semibold">Password</label>
              <input 
                type="password" 
                [(ngModel)]="password" 
                name="password" 
                placeholder="*****" 
                class="block w-full rounded-md border border-gray-300 focus:border-purple-700 focus:outline-none focus:ring-1 focus:ring-purple-700 py-2 px-2 text-gray-500" 
              />
            </div>
  
            <div class="mb-4 flex items-center justify-between">
              <div class="flex items-center">
                <input id="remember" type="checkbox" class="mr-2 checked:bg-purple-700" /> 
                <label for="remember" class="text-sm font-semibold">Recordar</label>
              </div>
              <a href="#" class="text-sm font-semibold text-purple-700">¿Has olvidado tu contraseña?</a>
            </div>
  
            <div class="mb-6">
              <button 
                type="submit" 
                class="block w-full text-center text-white bg-purple-700 hover:bg-purple-900 px-4 py-2 rounded-md font-semibold text-lg">
                Iniciar sesión
              </button>
            </div>
          </form>
  
          <!-- Footer -->
          <div class="text-center">
            <span class="text-sm text-gray-400 font-semibold">¿No tienes cuenta?</span>
            <a href="#" class="text-sm font-semibold text-purple-700">Regístrate</a>
          </div>
        </div>
      </div>
  
      <!-- Login banner -->
      <div class="flex flex-wrap content-center justify-center rounded-r-md" style="width: 24rem; height: 32rem;">
        <img 
          class="w-full h-full object-cover rounded-r-md" 
          src="https://actualidadempresa.com/wp-content/uploads/2014/10/organizar.jpg" 
          alt="Imagen de organización" 
        />
      </div>
    </div>
  
    <!-- Credit -->
    <div class="mt-6 w-full">
      <p class="text-center text-sm">Made by 
        <a target="_blank" href="https://www.instagram.com/_inubayuaji/" class="text-purple-700">Inu Bayu Aji</a> 
        and inspired by 
        <a target="_blank" href="https://dribbble.com/shots/17564792-Log-in-page-Untitled-UI" class="text-purple-700">this</a>.
      </p>
    </div>
  </div>
